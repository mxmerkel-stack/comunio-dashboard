name: Gerüchte und Ausfälle aktualisieren

on:
  schedule:
    - cron: "17 3 * * 4"   # donnerstags ~05:17 Uhr (MESZ)
  workflow_dispatch:         # Knopf "Run workflow"

permissions:
  contents: write
  actions: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aktuellen Kader bei Comunio abrufen
        env:
          DATA_DIR: data
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
        run: python scripts/fetch_comunio.py

      - name: Recherche (Websuche über Gemini oder Claude)
        env:
          DATA_DIR: data
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_research.py

      - name: Änderungen speichern
        id: commit
        run: |
          python -c "import json;[json.load(open(f'research/{n}.json')) for n in ('rumors','injuries')]"
          if git diff --quiet -- research; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "Maximilian"
          git config user.email "mxmerkel@users.noreply.github.com"
          git add research
          git commit -m "Recherche aktualisiert: Gerüchte und Ausfälle ($(date +%d.%m.%Y))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dashboard neu bauen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
