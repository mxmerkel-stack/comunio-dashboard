name: Push-Erinnerungen

# Schickt Nachrichten aufs iPhone (über ntfy.sh, Secret NTFY_TOPIC):
#  - Abend vor dem Spieltag (20 Uhr): Warnungen und Tausch-Vorschläge
#  - 3 Std. vor Anpfiff: nur bei negativem Konto oder unbesetzter Position
#  - abends: empfohlene Angebote, die bald ablaufen
on:
  schedule:
    - cron: "7 17-20 * * *"   # Abend vor dem Spieltag: gesendet wird nur um 20 Uhr (Berlin)
    - cron: "11,41 6-19 * * *" # 3 Std. vor Anpfiff: nur bei Minus oder leerer Position
    - cron: "17 16 * * *"     # Abendhinweis zu auslaufenden Angeboten
    - cron: "13,43 5-9,17-23 * * *" # Spieltagsergebnis, sobald alle Spiele beendet und die Punkte da sind
  workflow_dispatch:
    inputs:
      mode:
        description: "Test (sendet sofort, ohne Zeitprüfung): test, eve, alarm, result oder auctions"
        type: choice
        options: [test, eve, alarm, result, auctions]
        default: test

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: data
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"; echo "force=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 16 * * *" ]; then
            echo "mode=auctions" >> "$GITHUB_OUTPUT"; echo "force=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "13,43 5-9,17-23 * * *" ]; then
            echo "mode=result" >> "$GITHUB_OUTPUT"; echo "force=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "11,41 6-19 * * *" ]; then
            echo "mode=alarm" >> "$GITHUB_OUTPUT"; echo "force=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=eve" >> "$GITHUB_OUTPUT"; echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bereits gemeldet (Zwischenspeicher)
        uses: actions/cache/restore@v4
        with:
          path: data/notified.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-

      - name: Zeitpunkt prüfen
        id: gate
        if: steps.mode.outputs.mode != 'auctions' && steps.mode.outputs.force != 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/notify_gate.py

      - name: Entscheiden
        id: go
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "NTFY_TOPIC nicht gesetzt – nichts zu tun"; exit 0; fi
          if [ "${{ steps.mode.outputs.mode }}" != "auctions" ] && [ "${{ steps.mode.outputs.force }}" != "true" ]; then
            echo "run=${{ steps.gate.outputs.run }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testnachricht (Push und Mail)
        if: steps.mode.outputs.mode == 'test'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/alert.py "Comunio Zentrale: Test" "Test der Benachrichtigungen. Wenn du das liest, kommen Fehlermeldungen bei dir an."

      - name: Abhängigkeiten
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        run: pip install -r requirements.txt

      - name: Verlauf laden (verschlüsselt)
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: data/history.enc
          key: history-restore-${{ github.run_id }}
          restore-keys: history-

      - name: Daten bei Comunio abrufen
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        env:
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_comunio.py

      - name: Daten aufbereiten
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python scripts/build_data.py

      - name: Nachricht senden
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        env:
          FORCE: ${{ steps.mode.outputs.force }}
          MD: ${{ steps.gate.outputs.md }}
        run: python scripts/push_ntfy.py --mode ${{ steps.mode.outputs.mode }}

      - name: Gemeldetes merken
        if: steps.go.outputs.run == 'true' && steps.mode.outputs.mode != 'test'
        uses: actions/cache/save@v4
        with:
          path: data/notified.json
          key: sent-${{ github.run_id }}
