name: Dashboard aktualisieren

on:
  schedule:
    - cron: "23 3 * * *"        # täglich ~05:23 Uhr (MESZ), nach den Transfers um 03:00
    - cron: "41 20 * * 5,6,0"   # Fr/Sa/So abends, nach den Spielen
  workflow_dispatch:             # Knopf "Run workflow" für ein Update von Hand
    inputs:
      force_mail:
        description: "Morgen-Mail jetzt senden (Test)"
        type: boolean
        default: false
      force_weekly:
        description: "Wochenrückblick jetzt senden (Test)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_DIR: data
      DIST_DIR: dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Verlauf laden (verschlüsselt)
        uses: actions/cache/restore@v4
        with:
          path: data/history.enc
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Daten bei Comunio abrufen
        env:
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_comunio.py

      - name: Adresse des Live-Dienstes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain | python -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')" || true)
            if [ -n "$sub" ]; then echo "LIVE_WORKER_URL=https://comunio-live.$sub.workers.dev" >> "$GITHUB_ENV"; fi
          fi

      - name: Daten aufbereiten
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python scripts/build_data.py

      - name: Morgen-Mail (Aufstellung und Kontostand prüfen)
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_MAIL: ${{ inputs.force_mail }}
        run: python scripts/send_mail.py

      - name: Wochenrückblick (montags)
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: python scripts/send_weekly.py

      - name: TRMNL-Anzeige aktualisieren
        continue-on-error: true
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          TRMNL_MARKET_WEBHOOK_URL: ${{ secrets.TRMNL_MARKET_WEBHOOK_URL }}
        run: python scripts/push_trmnl.py

      - name: Verlauf speichern (verschlüsselt)
        uses: actions/cache/save@v4
        with:
          path: data/history.enc
          key: history-${{ github.run_id }}

      - name: Seite bauen und verschlüsseln
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          python scripts/render_site.py
          python scripts/encrypt_page.py
          python scripts/make_icons.py
          touch dist/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Live-Daten (Spieltag)
        continue-on-error: true
        env:
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          python scripts/fetch_live.py
          python scripts/encrypt_page.py --live

      - name: Seite für Live-Updates merken
        uses: actions/cache/save@v4
        with:
          path: dist
          key: site-dist-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fehlermeldung senden
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python scripts/alert.py "Comunio Zentrale: Update fehlgeschlagen" "Das Dashboard konnte nicht aktualisiert werden. Die Seite zeigt weiter die letzten Daten."
