name: Live-Dienst bei Cloudflare einrichten

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: workers.dev-Adresse sicherstellen
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | python -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$sub" ]; then
            sub="comunio-$(python -c 'import secrets;print(secrets.token_hex(3))')"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$sub\"}" $API | python -c "import sys,json;d=json.load(sys.stdin);print('Subdomain angelegt' if d.get('success') else '::error title=Cloudflare::'+json.dumps(d.get('errors'))[:300])"
          fi
          echo "::notice title=Live-Dienst::https://comunio-live.$sub.workers.dev"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dienst hochladen
        working-directory: worker
        run: npx --yes wrangler@4 deploy

      - name: Zugangsdaten hinterlegen
        working-directory: worker
        env:
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          python - <<'PY' > /tmp/secrets.json
          import base64, json, os, sys
          sys.path.insert(0, "../scripts")
          from encrypt_page import derive_key
          _, key = derive_key(os.environ["PAGE_PASSWORD"])
          print(json.dumps({"COMUNIO_USER": os.environ["COMUNIO_USER"], "COMUNIO_PASS": os.environ["COMUNIO_PASS"],
                            "PAGE_KEY": base64.b64encode(key).decode()}))
          PY
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Seite neu bauen (Adresse des Dienstes übernehmen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
