name: API erkunden (einmalig)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Struktur der Live-Endpunkte
        env:
          COMUNIO_USER: ${{ secrets.COMUNIO_USER }}
          COMUNIO_PASS: ${{ secrets.COMUNIO_PASS }}
        run: python scripts/probe_api.py
